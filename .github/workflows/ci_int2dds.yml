name: CI int2DDS

on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'src/rs/int2DDS/**'

jobs:
  create_bin_release:
    name: Create binary release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rs/int2DDS
    steps:
    - name: Checkout sources
      uses: actions/checkout@v4
    - name: Build executable
      run: cargo build --package int2dds_test_main --release
    - name: Rename executable
      run: |
        version=$( cargo tree --package int2dds --depth 0 --prefix none | grep -oP '(?<=v)[0-9]+\.[0-9]+\.[0-9]+' )
        cp ./target/release/int2dds_test_main ./int2dds-${version}_test_main_linux
        mkdir artifacts
        zip --junk-paths artifacts/int2dds-${version}_test_main_linux.zip ./int2dds-${version}_test_main_linux
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: interoperability_executable
        path: src/rs/int2DDS/artifacts/
