# The ZeroDDS client of this repository's interoperability tests, built
# against ZeroDDS 1.0.0-rc.7.4 from crates.io. Its source is
# `tools/omg-xtypes-test-main` in https://github.com/zero-objects/zero-dds.
[workspace]

[package]
name = "zerodds_test_main_linux"
version = "1.0.0-rc.7.4"
description = "OMG dds-xtypes interoperability: the ZeroDDS client"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zero-objects/zero-dds"
publish = false

[lib]
name = "zerodds_omg_xtypes_test_main"
path = "src/lib.rs"

[[bin]]
name = "zerodds_test_main_linux"
path = "src/main.rs"

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7.4" }
zerodds-types = { version = "1.0.0-rc.7.4" }
zerodds-ast = { version = "1.0.0-rc.7" }
zerodds-ast-core = { version = "1.0.0-rc.7" }
zerodds-ast-layout = { version = "1.0.0-rc.7" }
zerodds-wire-codec = { version = "1.0.0-rc.7.3" }
zerodds-idl-compose = { version = "1.0.0-rc.7" }
zerodds-xml-compose = { version = "1.0.0-rc.7" }
zerodds-xml = { version = "1.0.0-rc.7" }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
